# TinyPerson Dataset Config for YOLOv8/v11
path: D:\ntpy\datasets\tiny_set\ # 数据集根目录（请根据你电脑的实际路径修改）
train: images/train # 训练集图片 (相对于 path)
val: images/test     # 验证集图片 (相对于 path，可使用官方 test 暂充当)
#test: images/test   # 测试集图片 (可选，严格学术划分时的官方真实测试集)


nc: 2

# 这样 0 和 1 就都是合法合规的标签了
names:
  0: sea_person
  1: earth_person