# Original CSFA topology with training-only object-conditioned spectral preservation loss.
nc: 10
ocsp_gain: 0.10
ocsp_small_area: 0.02
ocsp_temperature: 0.75
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, MAA, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, MAA, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [2, 1, OSF, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, SpectralTap, []]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 1, MAA, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[21, 24, 27], 1, Detect, [nc]]
