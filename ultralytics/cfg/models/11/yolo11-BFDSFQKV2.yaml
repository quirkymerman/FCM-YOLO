# YOLO11 with a three-input OSF-QKV P2 enhancement path.

nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 1, B_FDSF, [256]]  #256是c2的通道数，c1会自己填充，false是控制其中的中间块是bottleneck还是C3
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 1, B_FDSF, [512]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 1, B_FDSF, [512]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 1, B_FDSF, [1024]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 1, C2PSA, [1024]] # 10

head:

  # 构建 neck P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 P5 -> P4
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13 neck P4/16

  # SGFC-1：利用 P4 语义校准 P3
  - [[4, 13, 6], 1, OSF_QKV, [512]] # 14 calibrated P3/8

  # 使用校准后的 P3 构建 neck P3
  # 这里不能写 -1，因为上一层已经变成 SGFC
  - [13, 1, nn.Upsample, [None, 2, "nearest"]] # 15 neck P4 -> P3
  - [[-1, 14], 1, Concat, [1]] # 16 cat calibrated P3
  - [-1, 2, C3k2, [256, False]] # 17 neck P3/8


  - [[2, 17, 4], 1, OSF_QKV, [256]] # 18 calibrated P2/4
  # [Q=backbone P2, K=calibrated P3, V=neck P3]

  # P2 -> P3 融合
  - [-1, 1, Conv, [256, 3, 2]] # 19 P2/4 -> P3/8
  - [[-1, 17], 1, Concat, [1]] # 20 cat neck P3
  - [-1, 2, C3k2, [256, False]] # 21 P3/8-small

  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]] # 22
  - [[-1, 13], 1, Concat, [1]] # 23 cat neck P4
  - [-1, 2, C3k2, [512, False]] # 24 P4/16-medium

  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]] # 25
  - [[-1, 10], 1, Concat, [1]] # 26 cat backbone P5
  - [-1, 2, C3k2, [1024, True]] # 27 P5/32-large

  - [[21, 24, 27], 1, Detect, [nc]] # 28 Detect(P3, P4, P5)
