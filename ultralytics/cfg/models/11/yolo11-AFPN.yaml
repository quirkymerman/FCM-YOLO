# YOLO11 object detection model using the official three-level AFPN neck.
# P3/8, P4/16 and P5/32 backbone features are fused by AFPN.

nc: 10
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]       # 4: P3/8
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]              # 6: P4/16
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]                  # 10: P5/32

head:
  - [[4, 6, 10], 1, AFPN, []]               # 11: (P3, P4, P5)
  - [11, 1, Index, [512, 0]]                # 12: P3/8
  - [11, 1, Index, [512, 1]]                # 13: P4/16
  - [11, 1, Index, [1024, 2]]               # 14: P5/32
  - [[12, 13, 14], 1, Detect, [nc]]
