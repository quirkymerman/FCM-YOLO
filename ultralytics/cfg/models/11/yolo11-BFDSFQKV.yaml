# YOLO11 with a three-input OSF-QKV P2 enhancement path.

nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 1, B_FDSF, [256]]  #256是c2的通道数，c1会自己填充，false是控制其中的中间块是bottleneck还是C3
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 1, B_FDSF, [512]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 1, B_FDSF, [512]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 1, B_FDSF, [1024]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 1, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13 head P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16-neck P3/8 (K source)

  - [[2, 16, 4], 1, OSF_QKV, [256]] # 17 weighted P2/4: [Q, K, V]
  - [-1, 1, Conv, [256, 3, 2]] # 18 P2/4 -> P3/8
  - [[-1, 16], 1, Concat, [1]] # 19 merge weighted P2 with neck P3
  - [-1, 2, C3k2, [256, False]] # 20 P3/8-small

  - [-1, 1, Conv, [256, 3, 2]] # 21
  - [[-1, 13], 1, Concat, [1]] # 22 cat head P4
  - [-1, 2, C3k2, [512, False]] # 23 P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]] # 24
  - [[-1, 10], 1, Concat, [1]] # 25 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 26 P5/32-large

  - [[20, 23, 26], 1, Detect, [nc]] # 27 Detect(P3, P4, P5)
